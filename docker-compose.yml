version: '3.8'

services:
  # 1. REST API Gateway (FastAPI)
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: copilot_gateway
    ports:
      - "8000:8000"
    environment:
      - GENAI_SERVICE_URL=http://genai_copilot:8001
      - FRAUD_SERVICE_URL=http://fraud_detector:8002
    depends_on:
      - genai_copilot
      - fraud_detector
      - redis
    networks:
      - copilot-network
    restart: always

  # 2. GenAI Copilot Microservice (Google Gemini API)
  genai_copilot:
    build:
      context: ./services/genai_copilot
      dockerfile: Dockerfile
    container_name: copilot_genai_service
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - copilot-network
    restart: always

  # 3. Fraud & Anomaly Detector Service (PyTorch / XGBoost)
  fraud_detector:
    build:
      context: ./services/fraud_detector
      dockerfile: Dockerfile
    container_name: copilot_fraud_service
    ports:
      - "8002:8002"
    networks:
      - copilot-network
    restart: always

  # 4. Redis (Кэш фичей и Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: copilot_redis
    ports:
      - "6379:6379"
    networks:
      - copilot-network

  # 5. PostgreSQL (Основная БД)
  postgres:
    image: postgres:15-alpine
    container_name: copilot_postgres
    environment:
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: copilot_password
      POSTGRES_DB: financial_copilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - copilot-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: copilot_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" #gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: copilot_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    restart: always

networks:
  copilot-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data: